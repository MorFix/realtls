name: Release

# Auto-publishes @realtls/js to npm and tags the commit whenever the version in
# package.json changes on main. No manual `git tag` needed.
#
# One-time setup (see docs/PUBLISHING.md):
#   1. Create the free npm org "realtls" (https://www.npmjs.com/org/create).
#   2. Create an npm **Automation** access token (bypasses 2FA/OTP for CI publishes).
#   3. Add it as the GitHub Actions secret NPM_TOKEN.
# Until NPM_TOKEN is set, this workflow runs and safely no-ops.

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write # create tags + GitHub Releases
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci

      - name: Read package version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already tagged
        id: check
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.version.outputs.version }} already exists — nothing to release."
          elif [ -z "$NPM_TOKEN" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN is not set — skipping publish (see docs/PUBLISHING.md)."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify (lint + typecheck + tests + build)
        if: steps.check.outputs.release == 'true'
        run: |
          npm run lint
          npm run typecheck
          npx vitest run
          npm run build

      - name: Publish to npm
        if: steps.check.outputs.release == 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag + create GitHub Release
        if: steps.check.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
