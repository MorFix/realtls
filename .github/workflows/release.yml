name: Release

# Auto-publishes @realtls/js to npm and tags the commit whenever the version in
# package.json changes on main. No manual `git tag` and no npm token needed.
#
# Auth uses npm Trusted Publishing (OIDC): npm trusts this workflow directly.
# One-time setup (see docs/PUBLISHING.md):
#   1. The @realtls org exists on npm.
#   2. On npmjs.com, configure @realtls/js → Settings → Trusted Publisher:
#        repository = MorFix/realtls, workflow = release.yml.
# Requires: permissions.id-token: write (below) and npm >= 11.5.1 (installed below).

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write # create tags + GitHub Releases
  id-token: write # OIDC auth for npm Trusted Publishing (+ provenance)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted Publishing (OIDC) needs a recent npm.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Read package version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already tagged
        id: check
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.version.outputs.version }} already exists — nothing to release."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify (lint + typecheck + tests + build)
        if: steps.check.outputs.release == 'true'
        run: |
          npm run lint
          npm run typecheck
          npx vitest run
          npm run build

      - name: Publish to npm (Trusted Publishing / OIDC)
        if: steps.check.outputs.release == 'true'
        run: npm publish --access public

      - name: Tag + create GitHub Release
        if: steps.check.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
