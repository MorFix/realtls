name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Lint fails the build on any `!` non-null assertion (and other rules).
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx vitest run
